<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>What's for dinner?</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <!--header here-->
      <header class="header">
        <h1>What's for Dinner?</h1>
      </header>

      <!--subheader-->
      <div class="subheader">
        <p>recipes</p>
      </div>

      <section class="carousel-section">
        <button class="nav-arrow left-arrow">&larr;</button>

        <div class="carousel-items">
          <!-- Item 1 -->
          <div class="carousel-item">
            <div class="image-placeholder"></div>
            <p>description</p>
          </div>
          <!-- Item 2 -->
          <div class="carousel-item">
            <div class="image-placeholder"></div>
            <p>description</p>
          </div>
          <!-- Item 3 -->
          <div class="carousel-item">
            <div class="image-placeholder"></div>
            <p>description</p>
          </div>
          <!-- Item 4 -->
          <div class="carousel-item">
            <div class="image-placeholder"></div>
            <p>description</p>
          </div>
        </div>

        <button class="nav-arrow right-arrow">&rarr;</button>
        <button id="firstButton">Click here</button>
      </section>

      <section class="schedule-section">
        <div class="schedule-header">
          <p>days of the week</p>
        </div>

        <div class="days-container">
          <!-- Monday -->
          <div class="day-column">
            <span class="day-label">Monday</span>
            <div class="add-box">+</div>
          </div>
          <!-- Tuesday -->
          <div class="day-column">
            <span class="day-label">Tuesday</span>
            <div class="add-box">+</div>
          </div>
          <!-- Wednesday -->
          <div class="day-column">
            <span class="day-label">Wednesday</span>
            <div class="add-box">+</div>
          </div>
          <!-- Thursday -->
          <div class="day-column">
            <span class="day-label">Thursday</span>
            <div class="add-box">+</div>
          </div>
          <!-- Friday -->
          <div class="day-column">
            <span class="day-label">Friday</span>
            <div class="add-box">+</div>
          </div>
          <!-- Saturday -->
          <div class="day-column">
            <span class="day-label">Saturday</span>
            <div class="add-box">+</div>
          </div>
          <!-- Sunday -->
          <div class="day-column">
            <span class="day-label">Sunday</span>
            <div class="add-box">+</div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
